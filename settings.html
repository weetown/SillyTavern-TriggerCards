<div id="sttc_contents" class="sttc-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <div class="flex-container alignitemscenter margin0 flexGap10">
                <b>Trigger Cards</b>
                <small id="sttc-status" class="opacity50">Disabled for this chat</small>
            </div>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">
            <div class="flex-container flexGap10 flexWrap alignitemscenter">
                <label class="flex-container flexGap5 alignitemscenter margin0">
                    <input type="checkbox" id="sttc-enabled-toggle" />
                    <span>Enable for this chat</span>
                </label>
                <label class="flex-container flexGap5 alignitemscenter margin0">
                    <input type="checkbox" id="sttc-collapsed-toggle" />
                    <span>Start collapsed</span>
                </label>

                <button id="sttc-open-settings" class="menu_button">
                    Open Trigger Cards Settings
                </button>
            </div>

            <div class="marginTop10">
                <small>
                    This entry is a shortcut into Trigger Cards’ own settings drawer.
                    Actual settings are stored per-chat via metadata.
                </small>
            </div>
        </div>
    </div>
</div>
